# ============================================
# CONFIGURACIÓN DE PRODUCCIÓN (PostgreSQL en Render)
# ============================================

# No especificar dialecto explícitamente (Spring lo detecta automáticamente)
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Configuración de PostgreSQL usando variables de entorno de Render
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Desactivar H2 en producción
spring.h2.console.enabled=false